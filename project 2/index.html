<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job application form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="apply_box">
            <h1>Job application <span class="tittle_small">(web)</span></h1>
            <form action="">
                <div class="form_container">

                    <div class="form_control">
                        <label for="frist_name">Frist Name</label>
                        <input type=" text" id="frist_name" name="frist_name" placeholder="Enter your Frist name">
                    </div>


                    <div class="form_control">
                        <label for="last_name">Last Name</label>
                        <input type=" text" id="last_name" name="last_name" placeholder="Enter your  last name">
                    </div>


                    <div class="form_control">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email">
                    </div>


                    <div class="form_control">
                        <label for="job_role">Job Role</label>
                       <select name="job_role" id="job_role">
                        <option value="">select job role</option>
                        <option value="frontend">Frontend Developer </option>
                        <option value="backend">Backend Developer</option>
                        <option value="full_stack">Full Stack</option>
                        <option value="ui_ux">UI UX Developer</option>
                       </select>
                    </div>


                       <div class="address">
                        <label for="address">Address</label>
                        <textarea name="address" id="address" rows="4" cols="50" placeholder="Enter Address"></textarea>
                      </div>

                    <div class="form_control">
                        <label for="city">City</label>
                        <input type="text" id="city" name="city" placeholder="Enter your city">
                    </div>

                    <div class="form_control">
                        <label for="pincode">Pincode</label>
                        <input type="number" id="pincode" name="pincode" placeholder="Enter your pincode">
                    </div>

                    <div class="form_control">
                        <label for="date">Date</label>
                        <input type="date" id="date" name="date" value="2022-01-10">
                    </div>

                    <div class="form_control">
                        <label for="upload">upload your CV</label>
                        <input type="file" id="upload" name="upload" >
                    </div>


                    </div>
                    <div class="button_container">

                        <button type="submit">Apply Now </button>
                    </div>
                </div>

            </form>
        </div>
    </div>
</body>
</html>
